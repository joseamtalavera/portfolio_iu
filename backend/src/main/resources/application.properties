spring.datasource.url=jdbc:postgresql://localhost:5432/database_iu
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# This property (update) tells Hibernate to generate/update tables from entities at startup.
# Hibernate is ORM or Object-Relational Mapping framework. Map entities to tables and query the DB without using raw SQL.
# JPA or Java Persistence API is the standard Java specification for mapping object to DB and perform CRUD operations. Hibernate is the most common implementation.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL initialization from data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Load local secrets from backend/.env (git-ignored). In production these come from
# real environment variables instead; the import is optional so nothing breaks without it.
# The [.properties] suffix is required: Spring picks a parser from the file extension, and
# ".env" is not one it recognises, so without the hint the file is silently ignored.
spring.config.import=optional:file:./.env[.properties]

# No default value on purpose: the application must refuse to start rather than fall back
# to a known signing key. A committed secret lets anyone forge a token for any user.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
server.port=8081

# Include the exception message in error responses so the frontend can show a meaningful
# message (e.g. "Email already exists", "Invalid credentials") instead of a generic fallback.
server.error.include-message=always

# Stripe Configuration (loaded from environment variables or .env file)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id=${STRIPE_PRICE_ID:}
stripe.success-url=http://localhost:3000/subscription/success
stripe.cancel-url=http://localhost:3000/subscription/cancel
