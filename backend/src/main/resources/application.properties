spring.datasource.url=jdbc:postgresql://localhost:5432/database_iu
spring.datasource.username=bework_user
spring.datasource.password=bework_pass
# This property (update) tells Hibernate to generate/update tables from entities at startup.
# Hibernate is ORM or Object-Relational Mapping framework. Map entities to tables and query the DB without using raw SQL.
# JPA or Java Persistence API is the standard Java specification for mapping object to DB and perform CRUD operations. Hibernate is the most common implementation.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL initialization from data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Load local environment overrides from backend/.env (optional)
spring.config.import=optional:file:.env

